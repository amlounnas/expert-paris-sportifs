name: Expert Paris Sportifs PRO

on:
  schedule:
    - cron: '0 18 * * 2'
    - cron: '0 6 * * 5'
  workflow_dispatch:

jobs:
  send-betting-tips:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Expert PRO
      env:
        EMAIL_EXPEDITEUR: ${{ secrets.EMAIL_EXPEDITEUR }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_DESTINATAIRE: "am.lounnas@gmail.com"
        FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      run: python email
