name: Expert Paris Sportifs PRO

on:
  schedule:
    - cron: '0 18 * * 2'
    - cron: '0 6 * * 5'
  workflow_dispatch:

jobs:
  send-betting-tips:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Expert PRO
      env:
        FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python email

    - name: Commit tracking
      run: |
        git config user.name "paris-bot"
        git config user.email "bot@paris-sportifs.local"
        git add tracking.json
        git commit -m "tracking: add bets [skip ci]" || echo "no changes to commit"
        git push
