name: Expert Paris Sportifs

on:
  schedule:
    - cron: '0 7 * * 5'
    - cron: '0 7 * * 6'
  workflow_dispatch:

jobs:
  send-betting-tips:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run script
      env:
        EMAIL_EXPEDITEUR: ${{ secrets.EMAIL_EXPEDITEUR }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_DESTINATAIRE: "am.lounnas@gmail.com"
      run: python email
